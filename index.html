<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner</title>
    <!-- Include html5-qrcode via CDN for zero-dependency Vercel hosting -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* The Camera View */
        #reader {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            object-fit: cover;
        }
        
        #reader video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }

        /* The UI Overlay (Layer 2) */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none; /* Let clicks pass through to camera if needed */
        }

        /* Header */
        .header {
            padding: 40px 20px 20px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            text-align: center;
        }
        .header-title { font-size: 16px; font-weight: 700; color: white; margin-bottom: 4px; }
        .header-sub { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

        /* Middle Section (Viewfinder) */
        .middle {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .viewfinder {
            width: 250px;
            height: 250px;
            position: relative;
            margin-bottom: 24px;
        }
        .corner {
            position: absolute;
            width: 40px; height: 40px;
            border-color: #f8fafc;
            border-style: solid;
        }
        .tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 20px; }
        .tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 20px; }
        .bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 20px; }
        .br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 20px; }

        .hint-pill {
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Footer Section */
        .footer {
            padding: 20px 20px 40px 20px;
            background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Result Card */
        .result-card {
            background: rgba(20,20,20,0.95);
            border: 1px solid #333;
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            pointer-events: auto;
        }
        .result-card.success { border-color: #22c55e; background: rgba(22, 163, 74, 0.1); }
        .result-card.error { border-color: #ef4444; background: rgba(220, 38, 38, 0.1); }
        
        .result-icon { font-size: 32px; margin-bottom: 8px; }
        .result-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .result-name { font-size: 20px; color: white; margin-bottom: 4px; font-weight: bold; }
        .result-club { font-size: 14px; color: #cbd5e1; margin-bottom: 12px; }
        
        .meal-pill {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .meal-pill.veg { background: #166534; color: #86efac; }
        .meal-pill.non-veg { background: #991b1b; color: #fca5a5; }

        /* Status Bar */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 4px;
            background: #22c55e;
        }
        .status-dot.loading { background: #f59e0b; }
        .status-text { font-size: 12px; font-weight: 600; color: white; }

        /* Hide html5-qrcode built-in UI elements */
        #reader__dashboard_section_csr { display: none !important; }
        #reader__dashboard_section_swaplink { display: none !important; }
    </style>
</head>
<body>

    <!-- Camera Container -->
    <div id="reader"></div>

    <!-- UI Overlay -->
    <div class="overlay">
        
        <!-- Header -->
        <div class="header">
            <div class="header-title">🎗️ 25th Installation Ceremony</div>
            <div class="header-sub">QR Check-In Scanner</div>
        </div>

        <!-- Middle (Viewfinder) -->
        <div class="middle" id="middle-section">
            <div class="viewfinder">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>
            <div class="hint-pill" id="hint-text">Point at QR code</div>
        </div>

        <!-- Footer -->
        <div class="footer">
            
            <!-- Result Card -->
            <div class="result-card" id="result-card">
                <div class="result-icon" id="res-icon">✅</div>
                <div class="result-title" id="res-title">Check-in Successful</div>
                <div class="result-name" id="res-name">John Doe</div>
                <div class="result-club" id="res-club">RAC APIIT</div>
                <div class="meal-pill" id="res-meal">🥗 Veg</div>
                <div style="font-size: 12px; color: #94a3b8; margin-top: 12px;">Resetting automatically...</div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-dot" id="status-dot"></div>
                <div class="status-text" id="status-text">Ready to scan</div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz_s0Z7QJc9x4c-e35b7m8VzX1Nq7M_nOhU0oF-O8Xm0tQk1x4k_zW4M4b0x5J8J9Q/exec";
        
        let isScanning = true;
        let html5QrcodeScanner = null;

        // UI Elements
        const hintText = document.getElementById('hint-text');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const middleSection = document.getElementById('middle-section');
        const resultCard = document.getElementById('result-card');
        
        // Result Elements
        const resIcon = document.getElementById('res-icon');
        const resTitle = document.getElementById('res-title');
        const resName = document.getElementById('res-name');
        const resClub = document.getElementById('res-club');
        const resMeal = document.getElementById('res-meal');

        function setStatus(state) {
            if (state === 'READY') {
                statusDot.className = 'status-dot';
                statusText.innerText = 'Ready to scan';
                hintText.innerText = 'Point at QR code';
                middleSection.style.display = 'flex';
                resultCard.style.display = 'none';
            } else if (state === 'LOADING') {
                statusDot.className = 'status-dot loading';
                statusText.innerText = 'Processing...';
                hintText.innerText = '⏳ Checking in...';
            }
        }

        function showResult(data) {
            middleSection.style.display = 'none';
            resultCard.style.display = 'block';
            
            resName.innerText = data.name || 'Unknown';
            resClub.innerText = data.club || '';
            
            // Success
            if (data.status === 'success') {
                resultCard.className = 'result-card success';
                resTitle.style.color = '#4ade80';
                resIcon.innerText = '✅';
                resTitle.innerText = 'Check-in Successful';
            } else {
                resultCard.className = 'result-card error';
                resTitle.style.color = '#f87171';
                resIcon.innerText = '⚠️';
                resTitle.innerText = data.message || 'Error';
            }

            // Meal
            if (data.meal) {
                resMeal.style.display = 'inline-block';
                const isVeg = !data.meal.toLowerCase().includes('non');
                resMeal.className = `meal-pill ${isVeg ? 'veg' : 'non-veg'}`;
                resMeal.innerText = isVeg ? `🥗 ${data.meal}` : `🍗 ${data.meal}`;
            } else {
                resMeal.style.display = 'none';
            }

            // Auto Reset
            setTimeout(() => {
                setStatus('READY');
                isScanning = true;
            }, 3500);
        }

        async function onScanSuccess(decodedText) {
            if (!isScanning) return;
            isScanning = false;
            setStatus('LOADING');
            
            // Validate QR
            if (!decodedText.startsWith('REG-')) {
                showResult({ status: 'error', message: 'Invalid QR Code format', name: decodedText });
                return;
            }

            try {
                const reqUrl = `${GAS_URL}?id=${encodeURIComponent(decodedText)}`;
                const response = await fetch(reqUrl);
                const data = await response.json();
                showResult(data);
            } catch (err) {
                showResult({ status: 'error', message: 'Network Error', name: decodedText });
            }
        }

        // Initialize Camera
        function startCamera() {
            const html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.777778 };
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess, 
                (err) => {} // ignore normal read errors
            ).catch(err => {
                alert("Camera permission denied or camera not found!");
            });
        }

        // Start when loaded
        window.addEventListener('load', () => {
            startCamera();
        });
    </script>
</body>
</html>
