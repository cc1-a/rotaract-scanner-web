<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner</title>
    <!-- Include html5-qrcode via CDN for zero-dependency Vercel hosting -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* The Camera View */
        #reader {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            object-fit: cover;
        }
        
        #reader video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }

        /* The UI Overlay (Layer 2) */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none; /* Let clicks pass through to camera if needed */
        }

        /* Header */
        .header {
            padding: 40px 20px 20px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            text-align: center;
        }
        .header-title { font-size: 16px; font-weight: 700; color: white; margin-bottom: 4px; }
        .header-sub { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

        /* Middle Section (Viewfinder) */
        .middle {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .viewfinder {
            width: 250px;
            height: 250px;
            position: relative;
            margin-bottom: 24px;
        }
        .corner {
            position: absolute;
            width: 40px; height: 40px;
            border-color: #f8fafc;
            border-style: solid;
        }
        .tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 20px; }
        .tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 20px; }
        .bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 20px; }
        .br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 20px; }

        .hint-pill {
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Footer Section */
        .footer {
            padding: 20px 20px 40px 20px;
            background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Result Card */
        .result-card {
            background: rgba(20,20,20,0.95);
            border: 1px solid #333;
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            pointer-events: auto;
            /* Smooth animations */
            opacity: 0;
            transform: scale(0.95) translateY(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .result-card.show {
            display: block;
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .result-card.success { border-color: #22c55e; background: rgba(22, 163, 74, 0.1); }
        .result-card.error { border-color: #ef4444; background: rgba(220, 38, 38, 0.1); }
        .result-card.warning { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        
        .result-icon { font-size: 32px; margin-bottom: 8px; }
        .result-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .result-name { font-size: 20px; color: white; margin-bottom: 4px; font-weight: bold; }
        .result-club { font-size: 14px; color: #cbd5e1; margin-bottom: 12px; }
        
        .meal-pill {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .meal-pill.veg { background: #166534; color: #86efac; }
        .meal-pill.non-veg { background: #991b1b; color: #fca5a5; }

        /* Status Bar */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            transition: background 0.3s ease;
        }
        
        /* Pulse Animation for Status Dot */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1.2); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        @keyframes pulse-loading {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1.2); box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 4px;
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        .status-dot.loading { 
            background: #f59e0b; 
            animation: pulse-loading 1.5s infinite;
        }
        .status-text { font-size: 12px; font-weight: 600; color: white; }

        /* Hide html5-qrcode built-in UI elements */
        #reader__dashboard_section_csr { display: none !important; }
        #reader__dashboard_section_swaplink { display: none !important; }
    </style>
</head>
<body>

    <!-- Camera Container -->
    <div id="reader"></div>

    <!-- UI Overlay -->
    <div class="overlay">
        
        <!-- Header -->
        <div class="header">
            <div class="header-title">🎗️ 25th Installation Ceremony</div>
            <div class="header-sub">QR Check-In Scanner</div>
        </div>

        <!-- Middle (Viewfinder) -->
        <div class="middle" id="middle-section">
            <div class="viewfinder">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>
            <div class="hint-pill" id="hint-text">Point at QR code</div>
        </div>

        <!-- Footer -->
        <div class="footer">
            
            <!-- Result Card -->
            <div class="result-card" id="result-card">
                <div class="result-icon" id="res-icon">✅</div>
                <div class="result-title" id="res-title">Check-in Successful</div>
                <div class="result-name" id="res-name">John Doe</div>
                <div class="result-club" id="res-club">RAC APIIT</div>
                <div class="meal-pill" id="res-meal">🥗 Veg</div>
                <div style="font-size: 12px; color: #94a3b8; margin-top: 12px;">Resetting automatically...</div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-dot" id="status-dot"></div>
                <div class="status-text" id="status-text">Ready to scan</div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbweBr0dhRkexJVMbahGBhOUB_iZkznrUGCC13ynlDq3Mbtp5r8XMIP5AnoYvdzzOEx-sg/exec";
        
        let isScanning = true;
        let html5QrcodeScanner = null;

        // UI Elements
        const hintText = document.getElementById('hint-text');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const middleSection = document.getElementById('middle-section');
        const resultCard = document.getElementById('result-card');
        
        // Result Elements
        const resIcon = document.getElementById('res-icon');
        const resTitle = document.getElementById('res-title');
        const resName = document.getElementById('res-name');
        const resClub = document.getElementById('res-club');
        const resMeal = document.getElementById('res-meal');

        function triggerVibration(pattern) {
            if (navigator.vibrate) {
                navigator.vibrate(pattern);
            }
        }

        function setStatus(state) {
            if (state === 'READY') {
                statusDot.className = 'status-dot';
                statusText.innerText = 'Ready to scan';
                hintText.innerText = 'Point at QR code';
                
                middleSection.style.display = 'flex';
                // Trigger reflow to restart CSS animation smoothly if needed
                void middleSection.offsetWidth;
                
                resultCard.classList.remove('show');
                setTimeout(() => {
                    if(resultCard.classList.contains('show') === false) {
                        resultCard.style.display = 'none';
                    }
                }, 300); // Wait for fade out
                
            } else if (state === 'LOADING') {
                statusDot.className = 'status-dot loading';
                statusText.innerText = 'Processing...';
                hintText.innerText = '⏳ Checking in...';
                triggerVibration(50); // Small haptic bump
            }
        }

        function showResult(data) {
            middleSection.style.display = 'none';
            resultCard.style.display = 'block';
            
            // Allow display: block to apply before adding the 'show' class for the transition
            setTimeout(() => {
                resultCard.classList.add('show');
            }, 10);
            
            resName.innerText = data.name || 'Unknown';
            resClub.innerText = data.club || '';
            
            // Success / Duplicate / Error handling
            if (data.status === 'success') {
                if (data.duplicate) {
                    resultCard.className = 'result-card warning show';
                    resTitle.style.color = '#f59e0b';
                    resIcon.innerText = '⚠️';
                    resTitle.innerText = 'Already Checked In';
                    triggerVibration([100, 50, 100]); // Warning vibration
                } else {
                    resultCard.className = 'result-card success show';
                    resTitle.style.color = '#4ade80';
                    resIcon.innerText = '✅';
                    resTitle.innerText = 'Check-in Successful';
                    triggerVibration(200); // Success vibration
                }
            } else {
                resultCard.className = 'result-card error show';
                resTitle.style.color = '#f87171';
                resIcon.innerText = '❌';
                resTitle.innerText = data.message || data.error || 'Error';
                triggerVibration([50, 50, 50, 50, 50]); // Error vibration
            }

            // Meal
            if (data.meal) {
                resMeal.style.display = 'inline-block';
                const isVeg = !data.meal.toLowerCase().includes('non');
                resMeal.className = `meal-pill ${isVeg ? 'veg' : 'non-veg'}`;
                resMeal.innerText = isVeg ? `🥗 ${data.meal}` : `🍗 ${data.meal}`;
            } else {
                resMeal.style.display = 'none';
            }

            // Auto Reset
            setTimeout(() => {
                setStatus('READY');
                isScanning = true;
            }, 3500);
        }

        async function onScanSuccess(decodedText) {
            if (!isScanning) return;
            isScanning = false;
            setStatus('LOADING');
            
            // Validate QR
            if (!decodedText.startsWith('REG-')) {
                showResult({ status: 'error', message: 'Invalid QR Code format', name: decodedText });
                return;
            }

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ qrData: decodedText }),
                    headers: { 'Content-Type': 'text/plain' }
                });
                
                const data = await response.json();
                data.status = data.success ? 'success' : 'error';
                
                showResult(data);
            } catch (err) {
                showResult({ status: 'error', message: 'Network Error: ' + err.message, name: decodedText });
            }
        }

        // Initialize Camera
        function startCamera() {
            const html5QrCode = new Html5Qrcode("reader");
            // Let the camera naturally fill the space instead of a forced aspect ratio
            const config = { fps: 10, videoConstraints: { facingMode: "environment" } };
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess, 
                (err) => {} // ignore normal read errors
            ).catch(err => {
                alert("Camera permission denied or camera not found!");
            });
        }

        // Start when loaded
        window.addEventListener('load', () => {
            startCamera();
        });
    </script>
</body>
</html>
